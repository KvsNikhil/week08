# week08/.github/workflows/frontend-cd.yml

name: CD - Deploy Frontend to AKS

on:
  workflow_dispatch:
    inputs:
      product_api_ip:
        description: "External IP of Product Service"
        required: true
        default: "http://<ip_address>:8000"
      order_api_ip:
        description: "External IP of Order Service (e.g., http://Y.Y.Y.Y:8001)"
        required: true
        default: "http://<ip_address>:8001"
      aks_cluster_name:
        description: "Name of the AKS Cluster to deploy to"
        required: true
        default: "<aks_name>"
      aks_resource_group:
        description: "Resource Group of the AKS Cluster"
        required: true
        default: "<<resource_group_name>>"

  workflow_call:
    inputs:
      product_api_ip:
        required: true
        type: string
      order_api_ip:
        required: true
        type: string
      aks_cluster_name:
        required: true
        type: string
      aks_resource_group:
        required: true
        type: string

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest
    environment: Production
    env:
      # unique image tag per run
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
      # accept either server or name from secrets/vars (both are OK)
      ACR_SERVER_INPUT: ${{ secrets.ACR_LOGIN_SERVER || vars.ACR_LOGIN_SERVER || secrets.AZURE_CONTAINER_REGISTRY || vars.AZURE_CONTAINER_REGISTRY }}
      ACR_NAME_INPUT:   ${{ secrets.ACR_NAME || vars.ACR_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Resolve ACR values (handle either server or name)
      - name: Resolve ACR values
        shell: bash
        run: |
          ACR_SERVER="${ACR_SERVER_INPUT}"
          ACR_NAME="${ACR_NAME_INPUT}"

          if [ -z "$ACR_NAME" ] && [ -n "$ACR_SERVER" ]; then
            ACR_NAME="${ACR_SERVER%%.azurecr.io}"
          fi
          if [ -z "$ACR_SERVER" ] && [ -n "$ACR_NAME" ]; then
            ACR_SERVER="${ACR_NAME}.azurecr.io"
          fi
          if [ -z "$ACR_NAME" ] || [ -z "$ACR_SERVER" ]; then
            echo "ERROR: Provide ACR_LOGIN_SERVER (e.g. sit722week08.azurecr.io) or ACR_NAME (e.g. sit722week08) via secrets/variables." >&2
            exit 1
          fi

          echo "ACR_NAME=$ACR_NAME"     >> $GITHUB_ENV
          echo "ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV
          echo "Resolved ACR => name=$ACR_NAME, server=$ACR_SERVER"

      # IMPORTANT: login expects the *registry name*
      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Inject Backend IPs into Frontend main.js
        shell: bash
        run: |
          echo "Injecting IPs into frontend/main.js"
          sed -i "s|_PRODUCT_API_URL_|${{ inputs.product_api_ip }}|g" frontend/main.js
          sed -i "s|_ORDER_API_URL_|${{ inputs.order_api_ip }}|g"    frontend/main.js

          echo "--- Modified main.js ---"
          cat frontend/main.js
          echo "-----------------------"

      - name: Build and Push Frontend Image
        run: |
          docker build -t "${ACR_SERVER}/frontend:${IMAGE_TAG}" ./frontend
          docker push "${ACR_SERVER}/frontend:${IMAGE_TAG}"

          # also tag/push 'latest' so manifests can reference a stable tag
          docker tag  "${ACR_SERVER}/frontend:${IMAGE_TAG}" "${ACR_SERVER}/frontend:latest"
          docker push "${ACR_SERVER}/frontend:latest"

      - name: Set Kubernetes context (get AKS credentials)
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ inputs.aks_resource_group }}
          cluster-name:  ${{ inputs.aks_cluster_name }}

      - name: Deploy Frontend to AKS
        run: |
          echo "Deploying frontend (image: ${ACR_SERVER}/frontend:latest) to AKS cluster: ${{ inputs.aks_cluster_name }}"
          cd k8s/
          kubectl apply -f frontend.yaml
          # Ensure the Deployment uses the latest tag (safe if manifest already has it)
          # kubectl -n default set image deploy/<your-frontend-deploy-name> <container-name>=${ACR_SERVER}/frontend:latest || true

      - name: Logout from Azure (AKS deployment)
        if: always()
        run: az logout
