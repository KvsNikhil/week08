name: CD - Dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Resolve ACR variables
      - name: Resolve ACR values
        shell: bash
        run: |
          ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER || vars.ACR_LOGIN_SERVER || secrets.AZURE_CONTAINER_REGISTRY || vars.AZURE_CONTAINER_REGISTRY }}"
          ACR_NAME="${{ secrets.ACR_NAME || vars.ACR_NAME }}"

          if [ -z "$ACR_NAME" ] && [ -n "$ACR_SERVER" ]; then
            ACR_NAME="${ACR_SERVER%%.azurecr.io}"
          fi
          if [ -z "$ACR_SERVER" ] && [ -n "$ACR_NAME" ]; then
            ACR_SERVER="${ACR_NAME}.azurecr.io"
          fi
          if [ -z "$ACR_NAME" ] || [ -z "$ACR_SERVER" ]; then
            echo "ERROR: Set ACR_NAME or ACR_SERVER in secrets or variables" >&2
            exit 1
          fi

          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV
          echo "Using ACR_NAME=$ACR_NAME, ACR_SERVER=$ACR_SERVER"

      # 4️⃣ Login to ACR
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # 5️⃣ Build & push backend images
      - name: Build & Push Product Service
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t "${ACR_SERVER}/product_service:${IMAGE_TAG}" ./backend/product_service
          docker push "${ACR_SERVER}/product_service:${IMAGE_TAG}"
          docker tag "${ACR_SERVER}/product_service:${IMAGE_TAG}" "${ACR_SERVER}/product_service:latest"
          docker push "${ACR_SERVER}/product_service:latest"

      - name: Build & Push Order Service
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t "${ACR_SERVER}/order_service:${IMAGE_TAG}" ./backend/order_service
          docker push "${ACR_SERVER}/order_service:${IMAGE_TAG}"
          docker tag "${ACR_SERVER}/order_service:${IMAGE_TAG}" "${ACR_SERVER}/order_service:latest"
          docker push "${ACR_SERVER}/order_service:latest"

      # 6️⃣ Build & push frontend image
      - name: Build & Push Frontend
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t "${ACR_SERVER}/frontend:${IMAGE_TAG}" ./frontend
          docker push "${ACR_SERVER}/frontend:${IMAGE_TAG}"
          docker tag "${ACR_SERVER}/frontend:${IMAGE_TAG}" "${ACR_SERVER}/frontend:latest"
          docker push "${ACR_SERVER}/frontend:latest"

      # 7️⃣ Set AKS context
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: DefaultResourceGroup-ASE
          cluster-name: week92c

      # 8️⃣ Create namespace if it doesn't exist
      - name: Create namespace if missing
        run: |
          if ! kubectl get namespace w08-dev >/dev/null 2>&1; then
            kubectl create namespace w08-dev
          fi

       # 9️⃣ Deploy all manifests to AKS
      - name: Deploy All to AKS
        run: |
          kubectl config set-context --current --namespace=w08-dev

          # Replace image tags dynamically in YAML before applying
          sed -i "s|product_service:latest|product_service:${GITHUB_SHA}|g" k8s/product-service.yaml
          sed -i "s|order_service:latest|order_service:${GITHUB_SHA}|g" k8s/order-service.yaml
          sed -i "s|frontend:latest|frontend:${GITHUB_SHA}|g" k8s/frontend.yaml

          kubectl apply -f k8s/ --recursive

      # 🔟 (Optional) Wait for deployments to be ready
      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/product-service -n w08-dev
          kubectl rollout status deployment/order-service -n w08-dev
          kubectl rollout status deployment/frontend -n w08-dev
