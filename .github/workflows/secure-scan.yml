name: secure-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Dockerfiles
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' DOCKERFILES < <(find . -type f -name 'Dockerfile' -print0)
          if (( ${#DOCKERFILES[@]} == 0 )); then
            echo "No Dockerfiles found."
            exit 1
          fi
          images=()
          for df in "${DOCKERFILES[@]}"; do
            dir="$(dirname "$df")"
            name="$(basename "$dir")"
            tag="local/${name}:${GITHUB_SHA}"
            echo "::group::Building $tag from $df"
            docker build -t "$tag" "$dir"
            echo "::endgroup::"
            images+=("$tag")
          done
          printf '%s\n' "${images[@]}" | tee /tmp/images.list
          echo "count=${#images[@]}" >> "$GITHUB_OUTPUT"

      - name: Scan images with Docker Scout (gate on fixable High/Critical)
        if: steps.build.outputs.count != '0'
        shell: bash
        env:
          SEVERITIES: critical,high
        run: |
          set -euo pipefail
          fail=0
          while read -r image; do
            echo "::group::Scanning $image"
            if docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker/scout-cli:latest `
                cves "$image" --only-severities "${SEVERITIES}" --only-fixed --exit-code; then
              echo " Passed gate for $image"
            else
              echo " Failed gate for $image (fixable ${SEVERITIES} CVEs found)"
              fail=1
            fi
            echo "::endgroup::"
          done </tmp/images.list
          if (( fail != 0 )); then
            echo "One or more images failed the security gate."
            exit 1
          fi
