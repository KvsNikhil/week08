name: CD - Dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      namespace: w08-dev
      image_tag: ${{ github.sha }}
      aks_cluster_name: week92c
      aks_resource_group: DefaultResourceGroup-ASE
    secrets: inherit
