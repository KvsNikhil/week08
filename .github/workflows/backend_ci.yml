# week08/.github/workflows/backend_ci.yml

name: Backend CI - Test, Build and Push Images to ACR

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'

# Global env (safe defaults)
env:
  # Accept EITHER login server (sit722week08.azurecr.io) OR name (sit722week08)
  # Put one of these in:  Settings → Secrets and variables → Actions → Secrets
  #   AZURE_CONTAINER_REGISTRY = sit722week08.azurecr.io  (recommended)
  # or AZURE_CONTAINER_REGISTRY = sit722week08
  ACR_INPUT: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

  # Image tag (unique per run)
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  test_and_lint_backends:
    runs-on: ubuntu-latest

    services:
      product_db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [ "5432:5432" ]

      order_db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [ "5433:5432" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          for req in backend/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
          pip install pytest httpx

      - name: Run product_service tests
        working-directory: backend/product_service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: products
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          pytest tests --maxfail=1 --disable-warnings -q

      - name: Run order_service tests
        working-directory: backend/order_service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: orders
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          pytest tests --maxfail=1 --disable-warnings -q

  build_and_push_images:
    runs-on: ubuntu-latest
    needs: test_and_lint_backends

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure login using the Service Principal JSON
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Resolve ACR name/server from ACR_INPUT, and export env for later steps
      - name: Resolve ACR values
        run: |
          if [ -z "${ACR_INPUT}" ]; then
            echo "ERROR: Secret AZURE_CONTAINER_REGISTRY is not set." >&2
            exit 1
          fi

          if [[ "${ACR_INPUT}" == *".azurecr.io" ]]; then
            ACR_SERVER="${ACR_INPUT}"
            ACR_NAME="${ACR_INPUT%%.azurecr.io}"
          else
            ACR_NAME="${ACR_INPUT}"
            ACR_SERVER="${ACR_INPUT}.azurecr.io"
          fi

          echo "Using ACR_NAME=${ACR_NAME}"
          echo "Using ACR_SERVER=${ACR_SERVER}"

          echo "ACR_NAME=${ACR_NAME}"     >> $GITHUB_ENV
          echo "ACR_SERVER=${ACR_SERVER}" >> $GITHUB_ENV

      # az acr login requires the *registry name*, not the login server
      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # Build & push product_service
      - name: Build and Push Product Service Image
        run: |
          docker build -t "${ACR_SERVER}/product_service:${IMAGE_TAG}" ./backend/product_service/
          docker push "${ACR_SERVER}/product_service:${IMAGE_TAG}"
          # also tag 'latest' if you want
          docker tag "${ACR_SERVER}/product_service:${IMAGE_TAG}" "${ACR_SERVER}/product_service:latest"
          docker push "${ACR_SERVER}/product_service:latest"

      # Build & push order_service
      - name: Build and Push Order Service Image
        run: |
          docker build -t "${ACR_SERVER}/order_service:${IMAGE_TAG}" ./backend/order_service/
          docker push "${ACR_SERVER}/order_service:${IMAGE_TAG}"
          docker tag "${ACR_SERVER}/order_service:${IMAGE_TAG}" "${ACR_SERVER}/order_service:latest"
          docker push "${ACR_SERVER}/order_service:latest"

      - name: Logout from Azure
        if: always()
        run: az logout
